<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix</title>
    <link rel="stylesheet" href="netflix.css">
</head>

<body>
    <div class="nav">
        <div class="lnav">
            <div class="logo">
                <img src="NetflixLogoSvg.png" alt="Netflix Logo" height="30px">
            </div>
            <div class="cate">
                <p><b>Start</b></p>
                <p>Shows</p>
                <p>Movies</p>
                <p>New</p>
                <p>My List</p>
            </div>
        </div>
        <div class="rnav">
            <img src="Search.png" alt="search" height="30px">
            <img src="GiftBox.png" alt="gift" height="30px">
            <img src="NotificationBell.png" alt="bell" height="30px">
            <div class="profile">
                <img src="ProfileIMG.png" alt="profile" height="30px">
                <img src="DownArrow.png" alt="DownArrow" height="20px">
            </div>
        </div>
    </div>
    <div class="title">
        <div class="nshow">
            <div class="symbol"><img src="Netflix_Symbol_RGB 1.png" alt="" height="35px"></div>
            <h3><b>S H O W</b></h3>
        </div>
        <div class="maid">
            <h1>MAID</h1>
        </div>
        <div class="buttons">
            <div class="play">
                <div class="pimg"><img src="Play.png" alt="" height="30px">
                </div><p>Play</p>
            </div>
            <div class="more">
                <img src="Detail.png" alt="">
                <p>More info</p>
            </div>
        </div>
    </div>
    <div class="add"><img src="Add.png" alt=""></div>
    <div class="sec1">
        <div class="seea">
            <p>See again</p>
            <img src="ArrowRight.png" alt="" height="20px">
        </div>
        <div class="sec1images">
            <img src="section 1.1.png" alt="">
            <img src="section 1.2.png" alt="">
            <img src="section 1.3.png" alt="">
            <img src="section 1.4.png" alt="">
            <img src="section 1.5.png" alt="">
        </div>
    </div>

    <div class="sec1">
        <div class="seea">
            <p>Top 10 in your country</p>
            <img src="ArrowRight.png" alt="" height="20px">
        </div>
        <div class="sec2images">
            <div class="sec21">
                <img src="Rank - 01.png" alt="" height="150px">
                <img src="section 2.1.png" alt="" height="194px">
            </div>
            <div class="sec22">
                <img src="Rank - 02.png" alt="" height="150px">
                <img src="section 2.2.png" alt="" height="194px">
            </div>
            <div class="sec23">
                <img src="Rank - 03.png" alt="" height="150px">
                <img src="section 2.3.png" alt="" height="194px">
            </div>
            <div class="sec24">
                <img src="Rank - 04.png" alt="" height="150px">
                <img src="section 2.4.png" alt="" height="194px">
            </div>
            <div class="sec25">
                <img src="Rank - 05.png" alt="" height="150px">
                <img src="section 2.5.png" alt="" height="194px">
            </div>
        </div>
    </div>

    <div class="sec1">
        <div class="seea">
            <p>Trending now</p>
            <img src="ArrowRight.png" alt="" height="20px">
        </div>
        <div class="sec1images">
            <img src="section 3.1.png" alt="">
            <img src="section 3.2.png" alt="">
            <img src="section 3.3.png" alt="">
            <img src="section 3.4.png" alt="">
            <img src="section 3.5.png" alt="">
        </div>
    </div>

    <div class="sec1">
        <div class="seea">
            <p>Sci-fi shows</p>
            <img src="ArrowRight.png" alt="" height="20px">
        </div>
        <div class="sec1images">
            <img src="section 4.1.png" alt="">
            <img src="section 4.2.png" alt="">
            <img src="section 4.3.png" alt="">
            <img src="section 4.4.png" alt="">
            <img src="section 4.5.png" alt="">
        </div>
    </div>

    <div class="footer">
        <div class="social">
            <img src="facebook.png" alt="">
            <img src="instagram.png" alt="">
            <img src="twitter.png" alt="">
            <img src="youtube.png" alt="">
        </div>

        
    </div>

</body>

</html>
